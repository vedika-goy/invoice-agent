<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img">
<title>High-level design of the invoice processing app</title>
<desc>A user's browser connects to a Streamlit app with three pages. The process page sends invoices to an invoice engine made of a reader, checks and a decision step. The engine calls the Claude API only to read the PDF, and uses CSV data, a SQLite database and a policy file.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{fill:none;stroke:#73726C;stroke-width:1.5}
.box{fill:#FFFFFF;stroke:#B4B2A9}
.frame{fill:none;stroke:#888780;stroke-width:0.5;stroke-dasharray:4 4}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="170" y="20" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="270" y="42" text-anchor="middle" dominant-baseline="central">AP clerk or interviewer</text>
<line x1="270" y1="64" x2="270" y2="98" class="arr" marker-end="url(#arrow)"/>
<rect class="frame" x="40" y="100" width="460" height="324" rx="16"/>
<text class="th" x="60" y="124" dominant-baseline="central">Streamlit app</text>
<text class="ts" x="60" y="142" dominant-baseline="central">Streamlit Community Cloud</text>
<g class="c-purple"><rect x="60" y="158" width="126" height="44" rx="8" stroke-width="0.5"/><text class="th" x="123" y="180" text-anchor="middle" dominant-baseline="central">Process invoice</text></g>
<g class="c-purple"><rect x="201" y="158" width="126" height="44" rx="8" stroke-width="0.5"/><text class="th" x="264" y="180" text-anchor="middle" dominant-baseline="central">Dashboard</text></g>
<g class="c-purple"><rect x="342" y="158" width="126" height="44" rx="8" stroke-width="0.5"/><text class="th" x="405" y="180" text-anchor="middle" dominant-baseline="central">How it decides</text></g>
<line x1="123" y1="202" x2="123" y2="220" class="arr" marker-end="url(#arrow)"/>
<rect class="frame" x="60" y="222" width="408" height="106" rx="12"/>
<text class="th" x="76" y="242" dominant-baseline="central">Invoice engine</text>
<g class="c-teal"><rect x="72" y="258" width="117" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="276" text-anchor="middle" dominant-baseline="central">Reader</text><text class="ts" x="130" y="296" text-anchor="middle" dominant-baseline="central">PDF to fields</text></g>
<line x1="190" y1="286" x2="203" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="205" y="258" width="117" height="56" rx="8" stroke-width="0.5"/><text class="th" x="263" y="276" text-anchor="middle" dominant-baseline="central">Checks</text><text class="ts" x="263" y="296" text-anchor="middle" dominant-baseline="central">Steps 2 to 5</text></g>
<line x1="323" y1="286" x2="336" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="338" y="258" width="117" height="56" rx="8" stroke-width="0.5"/><text class="th" x="396" y="276" text-anchor="middle" dominant-baseline="central">Decision</text><text class="ts" x="396" y="296" text-anchor="middle" dominant-baseline="central">Outcome, owner</text></g>
<line x1="468" y1="286" x2="518" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="520" y="258" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="580" y="276" text-anchor="middle" dominant-baseline="central">Claude API</text><text class="ts" x="580" y="296" text-anchor="middle" dominant-baseline="central">Reading only</text></g>
<line x1="123" y1="328" x2="123" y2="346" class="arr" marker-end="url(#arrow)"/>
<line x1="264" y1="328" x2="264" y2="346" class="arr" marker-end="url(#arrow)"/>
<line x1="405" y1="328" x2="405" y2="346" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="60" y="348" width="126" height="56" rx="8" stroke-width="0.5"/><text class="th" x="123" y="366" text-anchor="middle" dominant-baseline="central">CSV data</text><text class="ts" x="123" y="386" text-anchor="middle" dominant-baseline="central">Vendors, POs</text></g>
<g class="c-gray"><rect x="201" y="348" width="126" height="56" rx="8" stroke-width="0.5"/><text class="th" x="264" y="366" text-anchor="middle" dominant-baseline="central">SQLite</text><text class="ts" x="264" y="386" text-anchor="middle" dominant-baseline="central">Runs and audit</text></g>
<g class="c-gray"><rect x="342" y="348" width="126" height="56" rx="8" stroke-width="0.5"/><text class="th" x="405" y="366" text-anchor="middle" dominant-baseline="central">Policy file</text><text class="ts" x="405" y="386" text-anchor="middle" dominant-baseline="central">Tolerances</text></g>
<text class="ts" x="40" y="452" dominant-baseline="central">Purple: screens · Teal: process steps · Gray: data · Coral: the only AI call</text>
</svg>
