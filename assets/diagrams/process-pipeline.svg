<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1184" viewBox="0 0 680 1184" role="img">
<title>Invoice processing pipeline with fingerprinting and repeat-safety checks</title>
<desc>A PDF is validated, fingerprinted with SHA-256 and checked against earlier runs. A new run looks for a saved reading before calling Claude, checks and saves the reading, runs the checks, decides, saves and shows the result. Approvals are recorded once and count once toward the PO.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{fill:none;stroke:#73726C;stroke-width:1.5}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th{fill:#712B13}.c-coral .ts{fill:#993C1D}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="200" y="20" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="38" text-anchor="middle" dominant-baseline="central">Invoice PDF in</text><text class="ts" x="325" y="58" text-anchor="middle" dominant-baseline="central">Upload or sample button</text></g>
<line x1="325" y1="76" x2="325" y2="98" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="100" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="118" text-anchor="middle" dominant-baseline="central">Check the file</text><text class="ts" x="325" y="138" text-anchor="middle" dominant-baseline="central">Is it a PDF, under 10 MB?</text></g>
<line x1="450" y1="128" x2="478" y2="128" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="480" y="100" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="118" text-anchor="middle" dominant-baseline="central">Not valid</text><text class="ts" x="560" y="138" text-anchor="middle" dominant-baseline="central">Error, no run</text></g>
<line x1="325" y1="156" x2="325" y2="178" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="180" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="198" text-anchor="middle" dominant-baseline="central">Fingerprint the file</text><text class="ts" x="325" y="218" text-anchor="middle" dominant-baseline="central">SHA-256 of the file bytes</text></g>
<line x1="325" y1="236" x2="325" y2="258" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="260" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="278" text-anchor="middle" dominant-baseline="central">Seen this file before?</text><text class="ts" x="325" y="298" text-anchor="middle" dominant-baseline="central">Look up the fingerprint</text></g>
<line x1="450" y1="288" x2="478" y2="288" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="480" y="260" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="278" text-anchor="middle" dominant-baseline="central">Already seen</text><text class="ts" x="560" y="298" text-anchor="middle" dominant-baseline="central">Open earlier run</text></g>
<line x1="325" y1="316" x2="325" y2="338" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="340" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="358" text-anchor="middle" dominant-baseline="central">Create a run</text><text class="ts" x="325" y="378" text-anchor="middle" dominant-baseline="central">Each step logged, shown live</text></g>
<line x1="325" y1="396" x2="325" y2="418" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="420" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="438" text-anchor="middle" dominant-baseline="central">Saved reading?</text><text class="ts" x="325" y="458" text-anchor="middle" dominant-baseline="central">Look up by fingerprint</text></g>
<line x1="450" y1="448" x2="478" y2="448" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="480" y="420" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="438" text-anchor="middle" dominant-baseline="central">Yes: reuse it</text><text class="ts" x="560" y="458" text-anchor="middle" dominant-baseline="central">Skips the AI call</text></g>
<path d="M560 476 L560 768 L452 768" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="476" x2="325" y2="498" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="200" y="500" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="518" text-anchor="middle" dominant-baseline="central">Step 1 · Claude reads</text><text class="ts" x="325" y="538" text-anchor="middle" dominant-baseline="central">Fields with exact quotes</text></g>
<line x1="325" y1="556" x2="325" y2="578" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="580" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="598" text-anchor="middle" dominant-baseline="central">Check the answer</text><text class="ts" x="325" y="618" text-anchor="middle" dominant-baseline="central">Schema, retry once; scans twice</text></g>
<line x1="200" y1="608" x2="172" y2="608" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="30" y="580" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="598" text-anchor="middle" dominant-baseline="central">Unreadable</text><text class="ts" x="100" y="618" text-anchor="middle" dominant-baseline="central">Goes to review</text></g>
<path d="M100 636 L100 848 L198 848" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="636" x2="325" y2="658" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="660" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="678" text-anchor="middle" dominant-baseline="central">Save the reading</text><text class="ts" x="325" y="698" text-anchor="middle" dominant-baseline="central">By fingerprint, for re-runs</text></g>
<line x1="325" y1="716" x2="325" y2="738" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="740" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="758" text-anchor="middle" dominant-baseline="central">Steps 2–5 · Checks</text><text class="ts" x="325" y="778" text-anchor="middle" dominant-baseline="central">Numbers, vendor, duplicates, PO</text></g>
<line x1="325" y1="796" x2="325" y2="818" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="820" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="838" text-anchor="middle" dominant-baseline="central">Steps 6–7 · Decide</text><text class="ts" x="325" y="858" text-anchor="middle" dominant-baseline="central">Outcome, owner, policy version</text></g>
<line x1="325" y1="876" x2="325" y2="898" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="200" y="900" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="918" text-anchor="middle" dominant-baseline="central">Save and show</text><text class="ts" x="325" y="938" text-anchor="middle" dominant-baseline="central">Decision card and step log</text></g>
<line x1="450" y1="928" x2="478" y2="928" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="480" y="900" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="560" y="918" text-anchor="middle" dominant-baseline="central">Reviewer acts</text><text class="ts" x="560" y="938" text-anchor="middle" dominant-baseline="central">↻ re-run from 2–5</text></g>
<path d="M560 956 L560 1008 L452 1008" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="956" x2="325" y2="978" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="980" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="998" text-anchor="middle" dominant-baseline="central">Record approval once</text><text class="ts" x="325" y="1018" text-anchor="middle" dominant-baseline="central">Repeat clicks change nothing</text></g>
<line x1="325" y1="1036" x2="325" y2="1058" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="1060" width="250" height="56" rx="8" stroke-width="0.5"/><text class="th" x="325" y="1078" text-anchor="middle" dominant-baseline="central">Ledger updated</text><text class="ts" x="325" y="1098" text-anchor="middle" dominant-baseline="central">Counts once toward the PO</text></g>
<text class="ts" x="40" y="1144" dominant-baseline="central">Purple: fingerprint and repeat-safety checks · Coral: the only AI call</text>
<text class="ts" x="40" y="1164" dominant-baseline="central">Teal: processing steps · Gray: start, exits and shortcuts</text>
</svg>
